name: Docker image

# Publishes ghcr.io/marshin386/radarr.
# Non-default branches (including this PR branch): testing, the branch name, and sha-<commit>.
# develop: latest.
# A git tag such as v7.0.3-folders.1 is published under that exact name.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read fork version
        id: version
        run: echo "value=$(tr -d '[:space:]' < distribution/fork-version)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Host networking so apt can resolve archive.ubuntu.com inside BuildKit.
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marshin386/radarr
          tags: |
            type=raw,value=testing,enable=${{ github.ref_type == 'branch' && github.ref_name != 'develop' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref_type == 'branch' && github.ref_name != 'develop' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref_name != 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'develop' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Radarr (folder layouts fork)
            org.opencontainers.image.description=Marshin386 Radarr fork ${{ steps.version.outputs.value }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/Marshin386/Radarr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
